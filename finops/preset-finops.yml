meters:
- name: user_seats
  description: Active user seats billed per user per month on the Professional tier.
  unit: users
  aggregation: sum
  dimensions:
  - account
  - team
  - tier
- name: workspaces
  description: Workspaces provisioned against the plan's included workspace quota.
  unit: workspaces
  aggregation: sum
  dimensions:
  - account
  - team
- name: embedded_viewer_licenses
  description: Embedded-dashboard viewer licenses billed in packs (e.g. 50 viewers).
  unit: viewer_licenses
  aggregation: sum
  dimensions:
  - account
  - workspace
- name: api_access_addon
  description: Enterprise programmatic API access add-on entitlement.
  unit: contract
  aggregation: max
  dimensions:
  - account
principles:
- name: Visibility
  description: Track seat counts, workspace counts, and embedded viewer-license usage against invoiced subscription terms.
- name: Allocation
  description: Map workspaces and seats to teams and cost centers; tag API tokens per integration.
- name: Optimization
  description: Right-size seat counts, consolidate workspaces, and size embedded viewer packs to actual concurrency; reserve Enterprise API add-on for teams that automate.
- name: Accountability
  description: Assign workspace and billing owners; review seat and viewer-license spend each renewal cycle.
maintainers:

- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Preset spend. Preset bills as a per-user SaaS subscription
  rather than per-API-call usage: Starter is free for up to 5 users,
  Professional is $20/user/month annual ($25 monthly), and Enterprise is
  custom. Embedded dashboards are sold as viewer-license packs ($500/month per
  50 viewers) and programmatic API access is an Enterprise add-on. Cost drivers
  are seat count, workspace count, and embedded viewer volume rather than
  token or request metering.
notes: >-
  Per-user and add-on prices are subject to change; verify against the Preset
  pricing page during reconciliation.
sources:
- https://www.preset.io/pricing
- https://docs.preset.io
- https://focus.finops.org/focus-specification/v1-3/

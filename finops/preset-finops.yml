  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Preset
serviceCategory: Analytics and Business Intelligence
billingModel:
  pricingCategory: Subscription-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Preset Cloud
  ServiceCategory: Analytics and Business Intelligence
  ProviderName: Preset
  PublisherName: Preset
  InvoiceIssuerName: Preset
  BillingCurrency: USD
  ChargeCategory: Purchase
